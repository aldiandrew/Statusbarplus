name: Build Statusbarplus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized installable APK
        run: gradle :app:assembleOptimizedDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk

      - name: Report APK size
        run: du -h app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Statusbarplus-optimized-debug
          path: app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk
          retention-days: 7
