name: Build Statusbarplus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized free APK
        run: gradle :app:assembleFreeOptimizedDebug --stacktrace

      - name: Build optimized Pro APK
        run: gradle :app:assembleProOptimizedDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/optimizedDebug/free/app-free-optimizedDebug.apk
          test -s app/build/outputs/apk/optimizedDebug/pro/app-pro-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/optimizedDebug/free/app-free-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 app/build/outputs/apk/optimizedDebug/pro/app-pro-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/optimizedDebug/free/app-free-optimizedDebug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/optimizedDebug/pro/app-pro-optimizedDebug.apk

      - name: Report APK size
        run: |
          du -h app/build/outputs/apk/optimizedDebug/free/app-free-optimizedDebug.apk
          du -h app/build/outputs/apk/optimizedDebug/pro/app-pro-optimizedDebug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Statusbarplus-free-and-pro
          path: |
            app/build/outputs/apk/optimizedDebug/free/app-free-optimizedDebug.apk
            app/build/outputs/apk/optimizedDebug/pro/app-pro-optimizedDebug.apk
          retention-days: 7
