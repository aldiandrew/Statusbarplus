name: Build Statusbarplus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized free APK
        run: gradle :app:assembleFreeOptimizedDebug --stacktrace

      - name: Build optimized Pro APK
        run: gradle :app:assembleProOptimizedDebug --stacktrace

      - name: Verify APK
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name 'app-*-optimizedDebug.apk' | sort)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 "$apk"
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$apk"
          done

      - name: Report APK size
        run: |
          find app/build/outputs/apk -type f -name 'app-*-optimizedDebug.apk' -print -exec du -h {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: Statusbarplus-free-and-pro
          path: |
            app/build/outputs/apk/**/app-*-optimizedDebug.apk
          retention-days: 7
